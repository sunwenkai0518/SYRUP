name: Build macOS

"on":
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check python
        run: which python && python --version

      - name: Install
        run: python -m pip install pygame numpy pyinstaller

      - name: Build
        run: python -m PyInstaller --noconfirm --clean --onedir --windowed --name SYRUP --collect-all pygame main.py

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: SYRUP-macos
          path: dist/SYRUP.app
