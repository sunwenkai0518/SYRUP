name: Build macos

"on":
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pygame numpy pyinstaller

      - name: Build
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed \
            --name SYRUP --collect-all pygame \
            --exclude-module tkinter --exclude-module PIL --exclude-module matplotlib \
            main.py

      - name: Package
        run: ditto -c -k --sequesterRsrc --keepParent dist/SYRUP.app SYRUP-macos.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SYRUP-macos
          path: SYRUP-macos.zip
          if-no-files-found: error
