name: Build SYRUP

"on":
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
          - os: ubuntu-latest
            name: linux

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Linux font
        if: matrix.name == 'linux'
        run: sudo apt-get update && sudo apt-get install -y fonts-wqy-microhei

      - name: Install dependencies (Windows)
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pygame numpy pyinstaller

      - name: Install dependencies (Unix)
        if: matrix.name != 'windows'
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install pygame numpy pyinstaller

      - name: Build (Windows)
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed `
            --name SYRUP --collect-all pygame `
            --exclude-module tkinter --exclude-module PIL --exclude-module matplotlib `
            main.py

      - name: Build (Unix)
        if: matrix.name != 'windows'
        shell: bash
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed \
            --name SYRUP --collect-all pygame \
            --exclude-module tkinter --exclude-module PIL --exclude-module matplotlib \
            main.py

      - name: Package Windows
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          Copy-Item README.md dist/SYRUP/ -ErrorAction SilentlyContinue
          Compress-Archive -Path dist/SYRUP -DestinationPath SYRUP-windows.zip

      - name: Package macOS
        if: matrix.name == 'macos'
        shell: bash
        run: |
          cp README.md dist/ 2>/dev/null || true
          cd dist && zip -r ../SYRUP-macos.zip SYRUP.app

      - name: Package Linux
        if: matrix.name == 'linux'
        shell: bash
        run: |
          cp README.md dist/SYRUP/ 2>/dev/null || true
          cd dist && tar -czf ../SYRUP-linux.tar.gz SYRUP

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SYRUP-${{ matrix.name }}
          path: |
            SYRUP-windows.zip
            SYRUP-macos.zip
            SYRUP-linux.tar.gz
          if-no-files-found: ignore

      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            SYRUP-windows.zip
            SYRUP-macos.zip
            SYRUP-linux.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
